url: https://pbriesenkamp.github.io/ShuttleboxR/

template:
  bootstrap: 5
  light-switch: true

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]

reference:
- title: "Single trials: import and organise"
  desc: "Read, prepare and validate one shuttle-box recording."
  contents:
  - read_shuttlesoft
  - file_prepare
  - inspect

- title: "Single trials: calculate metrics"
  desc: "Calculate thermal, behavioural, movement and tracking metrics for one fish."
  contents:
  - calc_coreT
  - calc_distance
  - calc_Tpref
  - calc_Tavoid
  - calc_Tbreadth
  - calc_extremes
  - calc_tot_distance
  - calc_gravitation
  - calc_shuttles
  - calc_occupancy
  - calc_coreT_variance
  - calc_track_accuracy

- title: "Single trials: inspect and troubleshoot"
  desc: "Check temperature control, tracking and fish behaviour within a trial."
  contents:
  - plot_T_gradient
  - plot_T_segmented
  - plot_coreT_histogram
  - plot_distance
  - plot_heatmap
  - plot_tracking
  - plot_speed_coreT
  - animate_movements
  - plot_histogram
  - plot_interval

- title: "Projects: import and summarise"
  desc: "Combine trials and create or read a one-row-per-fish results database."
  contents:
  - read_shuttlesoft_project
  - compile_project_data
  - calc_project_results
  - read_project_database

- title: "Projects: inspect and flag trials"
  desc: "Explore variation across fish and identify candidates for single-trial review."
  contents:
  - plot_histograms
  - plot_distance_vs_shuttles
  - plot_limits_vs_distance
  - plot_limits_vs_shuttles
  - plot_upper_vs_lower_extremes
  - correlation_matrix
  - pca

articles:
- title: Getting started
  contents:
  - ShuttleboxR
